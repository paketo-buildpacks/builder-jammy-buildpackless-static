description = 'Static base image (Ubuntu Jammy Jellyfish build image, distroless-like run image) with no buildpacks included. To use, specify buildpacks at build time.'

[lifecycle]
version = '0.21.29'

[build]
image = 'docker.io/paketobuildpacks/build-jammy-static:0.0.276'

[run]
[[run.images]]
image = 'docker.io/paketobuildpacks/run-jammy-static:latest'

[stack]
id = 'io.buildpacks.stacks.jammy.static'

[[targets]]
os = 'linux'
arch = 'amd64'

[[targets]]
os = 'linux'
arch = 'arm64'
